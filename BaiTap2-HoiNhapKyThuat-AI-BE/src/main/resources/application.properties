spring.application.name=BaiTap2-HoiNhapKyThuat-AI
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/english_learning_support}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173}
app.jwt.base64-secret=${JWT_SECRET:noVGO4KXfRQijWLkkHTdwMZzJcsvohOLNTzXHkWOEOwwj50/QWunAGce8b6XKqUwss6ozCb5A/e++2SPZN/d2Q==}
app.jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_VALIDITY:86400}
app.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_TOKEN_VALIDITY:604800}
app.free-dictionary.base-url=${FREE_DICTIONARY_BASE_URL:https://freedictionaryapi.com/api/v1/entries/{language}/{word}}
app.free-dictionary.language=${FREE_DICTIONARY_LANGUAGE:en}
app.vocab.audio-storage-dir=${VOCAB_AUDIO_STORAGE_DIR:build/vocab-audio}
app.vocab.audio-base-url=${VOCAB_AUDIO_BASE_URL:/api/v1/vocabs/audio}
app.vocab.tts-language-code=${VOCAB_TTS_LANGUAGE_CODE:en-GB}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

spring.data.web.pageable.default-page-size=${DEFAULT_PAGE_SIZE:20}
spring.data.web.pageable.max-page-size=${MAX_PAGE_SIZE:2000}
spring.data.web.pageable.one-indexed-parameters=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
