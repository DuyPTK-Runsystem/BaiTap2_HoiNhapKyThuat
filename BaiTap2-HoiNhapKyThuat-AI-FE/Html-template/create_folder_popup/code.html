<body class="bg-surface-variant flex items-center justify-center min-h-screen p-4">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-40 transition-opacity flex items-center justify-center">
<!-- Modal Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant w-full max-w-md overflow-hidden flex flex-col transform transition-all">
<!-- Modal Header -->
<div class="p-card-padding flex justify-between items-start border-b border-surface-container-high pb-4">
<div class="flex items-center gap-inline-gap">
<span class="material-symbols-outlined text-[32px] text-on-surface" data-icon="folder" style="font-variation-settings: 'FILL' 0;">folder</span>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Tạo thư mục mới</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Tổ chức các bộ từ vựng của bạn một cách khoa học.</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors rounded-full p-1 hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-card-padding flex flex-col gap-stack-gap">
<!-- Field: Folder Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="folder-name">Tên thư mục <span class="text-error">*</span></label>
<input class="w-full h-10 px-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-outline" id="folder-name" placeholder="Ví dụ: IELTS Vocabulary, Kanji,..." type="text">
</div>
<!-- Field: Parent Folder -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="parent-folder">Thư mục gốc (Tùy chọn)</label>
<div class="relative">
<input type="text" value="--- Thư mục cấp cao nhất ---" disabled="" class="w-full h-10 px-3 bg-surface-container-low border border-outline-variant rounded-lg text-on-surface-variant cursor-not-allowed">

</div>
</div>
<!-- Field: Marking Color -->
<div class="flex flex-col gap-2">


</div>
</div>
<!-- Modal Footer -->
<div class="p-card-padding flex justify-end gap-3 border-t border-surface-container-high bg-surface-bright mt-auto">
<button class="h-10 px-4 rounded-lg border border-outline-variant text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary" type="button">
                    Hủy bỏ
                </button>
<button class="h-10 px-4 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm" type="button">
                    Tạo thư mục
                </button>
</div>
</div>
</div>
